name: CI

# The harvester commits to main four times a day and Vercel deploys whatever
# lands there, so a broken build or a scoring regression reaches the dashboard
# without anything in between. This runs on every push and pull request.
on:
  # Every branch, not just main: the point is to catch a regression before it
  # reaches main, and main is what Vercel ships.
  push:
    paths-ignore:
      # Data-only commits from the harvester change no code. Skipping them
      # keeps CI meaningful and avoids four no-op runs a day.
      - 'data/intel_snapshot.json'
      - 'data/intel_snapshot.backup.json'
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Harvester tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Validate the hand-maintained data files
        run: |
          python - <<'PY'
          import json, pathlib, sys

          suppliers = json.loads(pathlib.Path('data/suppliers.json').read_text())
          countries = json.loads(pathlib.Path('data/country_risk.json').read_text())['countries']

          errors = []
          seen = set()
          for entry in suppliers['suppliers']:
              name = entry.get('name')
              if not name or not entry.get('category'):
                  errors.append(f'{entry!r} needs a name and a category')
                  continue
              if name in seen:
                  errors.append(f'duplicate supplier {name!r}')
              seen.add(name)
              if entry['category'] not in suppliers['category_segments']:
                  errors.append(f'{name}: category {entry["category"]!r} has no segment mapping')

              if not entry.get('location'):
                  errors.append(f'{name}: no location')
              # location is the supplying site's country; hq_country only
              # exists to record a headquarters that sits somewhere else.
              if entry.get('hq_country') and entry['hq_country'] == entry.get('location'):
                  errors.append(f'{name}: hq_country repeats location, drop it')

          for country, spec in countries.items():
              if spec.get('level') not in {'LOW', 'MEDIUM', 'HIGH', 'CRITICAL'}:
                  errors.append(f'{country}: bad risk level {spec.get("level")!r}')
              if not spec.get('reason'):
                  errors.append(f'{country}: missing reason')

          if errors:
              print('\n'.join(f'::error::{e}' for e in errors))
              sys.exit(1)
          print(f'{len(seen)} suppliers, {len(countries)} country risk floors — OK')
          PY

  frontend:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
